<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAZZAN Semijoias</title>
<style>
:root{--gold:#ad8430;--gold-dark:#8f6b22;--ink:#292522;--muted:#756d63;--line:#eadfca;--soft:#f8f0df}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#fffdf8}.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#fffdf8;opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}.intro.done{opacity:0;visibility:hidden;pointer-events:none}.intro-content{width:min(520px,88vw);display:grid;justify-items:center;gap:24px;text-align:center}.intro-logo{display:block;width:min(470px,88vw);height:auto;animation:logoIn .85s ease both}.intro-line{width:min(260px,62vw);height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform-origin:center;animation:lineIn .8s .2s ease both}.intro-caption{margin:0;color:var(--gold-dark);font-size:12px;letter-spacing:.28em;text-transform:uppercase;animation:captionIn .8s .35s ease both}.intro-skip{position:absolute;right:22px;bottom:22px;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:#fff;color:var(--muted);cursor:pointer;font:inherit}.gate{min-height:100vh;display:grid;place-items:center;padding:28px 0;background:radial-gradient(circle at 50% 0,#f8f0df 0,#fffdf8 42%,#fff 100%)}.card{width:min(760px,94vw);background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 24px 70px rgba(62,41,10,.12)}.logo{display:block;width:min(440px,88%);height:auto;margin:0 auto 20px}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(34px,6vw,60px);font-weight:400;line-height:1;margin:0;text-align:center}p{color:var(--muted);line-height:1.6;text-align:center;margin:14px auto 22px;max-width:560px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}.type{border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px;text-align:left;cursor:pointer;color:var(--ink)}.type strong{display:block;font-size:16px;margin-bottom:5px}.type span{color:var(--muted);font-size:13px;line-height:1.35}.type.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(173,132,48,.14)}form{display:grid;gap:10px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields .full{grid-column:1/-1}input{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 15px;font:inherit;color:var(--ink)}.notice{border:1px solid var(--line);border-radius:18px;background:var(--soft);padding:14px;color:#635847;line-height:1.45}.notice strong{color:var(--gold-dark)}.btn{border:1px solid var(--gold);border-radius:999px;padding:13px 18px;background:var(--gold);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 14px 32px rgba(173,132,48,.22)}.hidden{display:none!important}@keyframes logoIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}@keyframes lineIn{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}@keyframes captionIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.intro,.intro-logo,.intro-line,.intro-caption{animation:none;transition:none}}@media(max-width:640px){.card{padding:20px}.options,.fields{grid-template-columns:1fr}h1,p{text-align:left}.logo{margin-left:0}}
</style>
</head>
<body>
<div class="intro" id="intro" aria-label="BRAZZAN Semijoias" role="status"><div class="intro-content"><img class="intro-logo" src="assets/logo-brazzan.png" alt="BRAZZAN Semijoias"><div class="intro-line"></div><p class="intro-caption">Semijoias</p></div></div>
<section class="gate"><div class="card"><img class="logo" src="assets/logo-brazzan.png" alt="BRAZZAN Semijoias"><h1>Bem-vindo ao catálogo</h1><p>Antes de entrar, informe seus dados para montarmos o atendimento correto.</p><div class="options"><button class="type active" type="button" data-type="pf"><strong>Comprar por unidade</strong><span>Pessoa física: nome e WhatsApp.</span></button><button class="type" type="button" data-type="pj"><strong>Comprar para empresas</strong><span>Empresa: nome, WhatsApp e CNPJ.</span></button></div><form id="form"><div class="fields"><input id="name" autocomplete="name" placeholder="Nome"><input id="phone" autocomplete="tel" inputmode="tel" placeholder="WhatsApp com DDD"><input class="full hidden" id="cnpj" inputmode="numeric" placeholder="CNPJ"></div><div class="notice hidden" id="notice"><strong>Catálogo para empresas em breve.</strong> Estamos preparando uma área para compras em grandes quantidades. Deixe seus dados para atendimento e cadastro.</div><button class="btn" id="submit" type="submit">Entrar no catálogo</button></form></div></section>
<script>
const intro=document.getElementById('intro');const closeIntro=()=>intro.classList.add('done');window.setTimeout(closeIntro,1800);let type='pf';const key='brazzan_entry';const nameInput=document.getElementById('name'),phoneInput=document.getElementById('phone'),cnpjInput=document.getElementById('cnpj'),notice=document.getElementById('notice'),submit=document.getElementById('submit'),form=document.getElementById('form');function entryText(e){return ['BRAZZAN Semijoias',type==='pj'?'Tenho interesse no catálogo para empresas.':'Cliente do catálogo por unidade.','',`Nome: ${e.name}`,`WhatsApp: ${e.phone}`,e.cnpj?`CNPJ: ${e.cnpj}`:''].filter(Boolean).join('\n')}document.querySelectorAll('.type').forEach(btn=>btn.onclick=()=>{type=btn.dataset.type;document.querySelectorAll('.type').forEach(b=>b.classList.toggle('active',b===btn));cnpjInput.classList.toggle('hidden',type!=='pj');notice.classList.toggle('hidden',type!=='pj');submit.textContent=type==='pj'?'Enviar cadastro no WhatsApp':'Entrar no catálogo'});form.onsubmit=e=>{e.preventDefault();const data={type,name:nameInput.value.trim(),phone:phoneInput.value.trim(),cnpj:cnpjInput.value.trim()};if(!data.name||!data.phone||(type==='pj'&&!data.cnpj)){alert('Preencha os dados para continuar.');return}localStorage.setItem(key,JSON.stringify(data));if(type==='pj'){window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(entryText(data)),'_blank');notice.classList.remove('hidden');notice.innerHTML='<strong>Cadastro recebido.</strong> O catálogo para empresas ainda esta em preparação. Enviamos seus dados para atendimento no WhatsApp.';return}location.href='catalogo.html'};
</script>
</body>
</html>
