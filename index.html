<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7">
<meta name="description" content="Catálogo digital BRAZZAN Semijoias.">
<title>BRAZZAN Semijoias</title>
<style>
:root{--gold:#ad8430;--gold-dark:#765718;--ink:#282522;--muted:#706960;--line:#e6dcc9;--paper:#fbfaf7;--soft:#f8f2e6;--danger:#8d3030}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--paper)}
button,input{font:inherit}
button{touch-action:manipulation}
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--paper);opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease}
.intro.done{opacity:0;visibility:hidden;pointer-events:none}
.intro-content{width:min(520px,88vw);display:grid;justify-items:center;gap:22px;text-align:center}
.intro-logo{display:block;width:min(470px,88vw);height:auto;animation:logoIn .75s ease both}
.intro-line{width:min(250px,60vw);height:2px;background:var(--gold);transform-origin:center;animation:lineIn .7s .18s ease both}
.intro-caption{margin:0;color:var(--gold-dark);font-size:12px;letter-spacing:.24em;text-transform:uppercase;animation:captionIn .7s .3s ease both}
.gate{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px 0}
.card{width:min(720px,94vw);background:#fff;border:1px solid var(--line);border-radius:8px;padding:clamp(22px,4vw,34px);box-shadow:0 18px 50px rgba(48,38,20,.1)}
.logo{display:block;width:min(430px,88%);height:auto;margin:0 auto 20px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,6vw,52px);font-weight:400;line-height:1.05;margin:0;text-align:center}
.lead{color:var(--muted);line-height:1.55;text-align:center;margin:12px auto 22px;max-width:540px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.type{min-height:78px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:15px;text-align:left;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s,box-shadow .15s}
.type strong{display:block;font-size:16px;margin-bottom:4px}.type span{color:var(--muted);font-size:13px;line-height:1.35}
.type.active{border-color:var(--gold);background:var(--soft);box-shadow:0 0 0 2px rgba(173,132,48,.12)}
form{display:grid;gap:10px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields .full{grid-column:1/-1}
input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:13px 14px;color:var(--ink)}
input::placeholder{color:#887f74}.notice{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:13px 14px;color:#5f5547;line-height:1.45;font-size:14px}.notice strong{color:var(--gold-dark)}
.form-error{margin:0;color:var(--danger);font-size:14px;line-height:1.4}.form-error:empty{display:none}
.btn{min-height:50px;border:1px solid var(--gold);border-radius:999px;padding:12px 18px;background:var(--gold);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(173,132,48,.2)}
.btn:hover{background:var(--gold-dark);border-color:var(--gold-dark)}
button:focus-visible,input:focus-visible{outline:3px solid rgba(173,132,48,.3);outline-offset:2px}
.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes logoIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes lineIn{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes captionIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.intro,.intro-logo,.intro-line,.intro-caption{animation:none;transition:none}}
@media(max-width:640px){.gate{align-items:start;padding:18px 0}.card{padding:20px}.options,.fields{grid-template-columns:1fr}h1,.lead{text-align:left}.logo{width:min(360px,94%);margin-left:0}.type{min-height:70px}}
</style>
<noscript><style>.intro{display:none}</style></noscript>
</head>
<body>
<div class="intro" id="intro" aria-label="BRAZZAN Semijoias" role="status"><div class="intro-content"><img class="intro-logo" src="assets/logo-brazzan.png" alt="BRAZZAN Semijoias"><div class="intro-line"></div><p class="intro-caption">Semijoias</p></div></div>
<main class="gate"><section class="card" aria-labelledby="welcomeTitle"><img class="logo" src="assets/logo-brazzan.png" alt="BRAZZAN Semijoias"><h1 id="welcomeTitle">Bem-vindo ao catálogo</h1><p class="lead">Antes de entrar, informe seus dados para direcionarmos seu atendimento.</p><div class="options" aria-label="Tipo de compra"><button class="type active" type="button" data-type="pf" aria-pressed="true"><strong>Comprar por unidade</strong><span>Pessoa física: nome e WhatsApp.</span></button><button class="type" type="button" data-type="pj" aria-pressed="false"><strong>Comprar para empresas</strong><span>Empresa: nome, WhatsApp e CNPJ.</span></button></div><form id="form" novalidate><div class="fields"><label class="sr-only" for="name">Nome</label><input id="name" autocomplete="name" maxlength="80" placeholder="Nome" required><label class="sr-only" for="phone">WhatsApp com DDD</label><input id="phone" autocomplete="tel" inputmode="tel" maxlength="15" placeholder="WhatsApp com DDD" required><label class="sr-only" for="cnpj">CNPJ</label><input class="full hidden" id="cnpj" inputmode="numeric" maxlength="18" placeholder="CNPJ"></div><div class="notice hidden" id="notice"><strong>Catálogo para empresas em breve.</strong> Estamos preparando uma área para compras em grandes quantidades. Deixe seus dados para atendimento e cadastro.</div><p class="form-error" id="formError" role="alert" aria-live="polite"></p><button class="btn" id="submit" type="submit">Entrar no catálogo</button></form></section></main>
<script>
const intro=document.getElementById('intro');
const closeIntro=()=>intro.classList.add('done');
try{if(sessionStorage.getItem('brazzan_intro_seen'))closeIntro();else{sessionStorage.setItem('brazzan_intro_seen','1');window.setTimeout(closeIntro,1500)}}catch{window.setTimeout(closeIntro,1500)}
let type='pf';
const key='brazzan_entry';
const nameInput=document.getElementById('name'),phoneInput=document.getElementById('phone'),cnpjInput=document.getElementById('cnpj'),notice=document.getElementById('notice'),submit=document.getElementById('submit'),form=document.getElementById('form'),formError=document.getElementById('formError');
const digits=value=>value.replace(/\D/g,'');
function formatPhone(value){const d=digits(value).slice(0,11);return d.length>6?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d}
function formatCnpj(value){const d=digits(value).slice(0,14);return d.length>12?`${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`:d.length>8?`${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8)}`:d.length>5?`${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5)}`:d.length>2?`${d.slice(0,2)}.${d.slice(2)}`:d}
function validCnpj(value){const d=digits(value);if(d.length!==14||/^([0-9])\1{13}$/.test(d))return false;const calc=position=>{const weights=position===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];let sum=0;for(let i=0;i<weights.length;i++)sum+=Number(d[i])*weights[i];return(sum%11<2?0:11-sum%11)===Number(d[position])};return calc(12)&&calc(13)}
function showError(message,input){formError.textContent=message;if(input)input.focus()}
function clearError(){formError.textContent=''}
function setType(next){type=next;document.querySelectorAll('.type').forEach(btn=>{const active=btn.dataset.type===type;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});const company=type==='pj';cnpjInput.classList.toggle('hidden',!company);cnpjInput.required=company;notice.classList.toggle('hidden',!company);nameInput.autocomplete=company?'organization':'name';submit.textContent=company?'Enviar cadastro no WhatsApp':'Entrar no catálogo';clearError()}
phoneInput.addEventListener('input',()=>{phoneInput.value=formatPhone(phoneInput.value);clearError()});
cnpjInput.addEventListener('input',()=>{cnpjInput.value=formatCnpj(cnpjInput.value);clearError()});
nameInput.addEventListener('input',clearError);
document.querySelectorAll('.type').forEach(btn=>btn.addEventListener('click',()=>setType(btn.dataset.type)));
function entryText(entry){return['BRAZZAN Semijoias',entry.type==='pj'?'Tenho interesse no catálogo para empresas.':'Cliente do catálogo por unidade.','',`Nome: ${entry.name}`,`WhatsApp: ${formatPhone(entry.phone)}`,entry.cnpj?`CNPJ: ${formatCnpj(entry.cnpj)}`:''].filter(Boolean).join('\n')}
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){nameInput.value=saved.name||'';phoneInput.value=formatPhone(saved.phone||'');cnpjInput.value=formatCnpj(saved.cnpj||'');if(saved.type==='pj')setType('pj')}}catch{}
form.addEventListener('submit',event=>{event.preventDefault();clearError();const name=nameInput.value.trim(),phone=digits(phoneInput.value),cnpj=digits(cnpjInput.value);if(name.length<2)return showError('Informe seu nome.',nameInput);if(!/^[1-9][0-9]9[0-9]{8}$/.test(phone))return showError('Informe um celular completo com DDD e o nono dígito.',phoneInput);if(type==='pj'&&!validCnpj(cnpj))return showError('Informe um CNPJ completo e válido.',cnpjInput);const entry={type,name,phone,cnpj};localStorage.setItem(key,JSON.stringify(entry));if(type==='pj'){const url='https://api.whatsapp.com/send?text='+encodeURIComponent(entryText(entry));const popup=window.open(url,'_blank');if(popup)popup.opener=null;else location.href=url;return}location.assign('catalogo.html')});
</script>
</body>
</html>
